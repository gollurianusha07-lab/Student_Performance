<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #5568d8;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f1f5ff;
            border-radius: 12px;
            text-align: center;
        }

        #result h2 {
            color: #333;
            margin-bottom: 8px;
        }

        #score {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        #error {
            color: red;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 Student Performance</h1>
    <p class="subtitle">Prediction using Machine Learning</p>

    <form id="predictionForm">

        <div class="input-group">
            <label>Study Hours per Day</label>
            <input type="number" id="study_hours"
                   step="0.1" min="0" max="24" required>
        </div>

        <div class="input-group">
            <label>Attendance (%)</label>
            <input type="number" id="attendance"
                   step="0.1" min="0" max="100" required>
        </div>

        <div class="input-group">
            <label>Previous Score</label>
            <input type="number" id="previous_score"
                   step="0.1" min="0" max="100" required>
        </div>

        <div class="input-group">
            <label>Assignments Completed</label>
            <input type="number" id="assignments_completed"
                   min="0" required>
        </div>

        <div class="input-group">
            <label>Sleep Hours</label>
            <input type="number" id="sleep_hours"
                   step="0.1" min="0" max="24" required>
        </div>

        <button type="submit">
            Predict Performance
        </button>

    </form>

    <div id="result">
        <h2>Predicted Score</h2>
        <div id="score">--</div>
        <p>out of 100</p>
    </div>

    <div id="error"></div>

</div>


<script>

document.getElementById("predictionForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    document.getElementById("result").style.display = "none";
    document.getElementById("error").innerText = "";

    const studentData = {
        study_hours: parseFloat(document.getElementById("study_hours").value),

        attendance: parseFloat(document.getElementById("attendance").value),

        previous_score: parseFloat(document.getElementById("previous_score").value),

        assignments_completed: parseInt(document.getElementById("assignments_completed").value),

        sleep_hours: parseFloat(document.getElementById("sleep_hours").value)
    };

    try {

        const response = await fetch("http://127.0.0.1:8000/predict", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(studentData)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error("Prediction failed");
        }

        document.getElementById("score").innerText =
            data.predicted_score;

        document.getElementById("result").style.display = "block";

    } catch (error) {

        document.getElementById("error").innerText =
            "Unable to connect to the server. Please start FastAPI.";

    }

});

</script>

</body>
</html>
